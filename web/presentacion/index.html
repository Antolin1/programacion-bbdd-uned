<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Misión SQL · Presentación</title>
  <meta name="description" content="Presentación interactiva de Misión SQL: teoría de SQL con consultas que se ejecutan en el navegador, acceso a los tres juegos y caja fuerte final.">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css">
  <link rel="stylesheet" href="../assets/common.css">
  <link rel="stylesheet" href="presentacion.css">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tsparticles-slim@2.12.0/tsparticles.slim.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/sql-wasm.js"></script>
  <script src="../assets/common.js"></script>
</head>
<body>
  <div id="particles"></div>

  <div id="pie-fijo">Misión SQL · Cooperativa Huerta de Murcia</div>

  <div id="herramientas" aria-label="Herramientas">
    <span class="chip" title="Dígitos de la caja fuerte"><i data-lucide="key-round"></i><span class="mini-digits" id="mini-digitos"></span></span>
    <button class="btn ghost small ver-tablas" type="button"><i data-lucide="table-2"></i> Ver tablas</button>
  </div>

  <div class="reveal">
    <div class="slides">
      <section data-markdown="slides.md" data-separator="^\r?\n---\r?\n$" data-separator-notes="^Note:" data-charset="utf-8"></section>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/markdown/markdown.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/highlight.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/notes/notes.js"></script>
  <script src="presentacion.js"></script>
</body>
</html>
