<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" preserveAspectRatio="xMidYMax meet">
  <!-- Paisaje de la huerta de Murcia (se repite en horizontal): sierra, bancales, acequia,
       palmeras, una barraca y limoneros. Los extremos encajan para que el mosaico sea continuo. -->
  <defs>
    <pattern id="surcos" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(-8)">
      <rect width="14" height="14" fill="#9cc365"/>
      <rect width="14" height="5" fill="#86b04f"/>
    </pattern>
    <pattern id="surcos2" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(6)">
      <rect width="12" height="12" fill="#b9cf6a"/>
      <rect width="12" height="4" fill="#a3bd55"/>
    </pattern>
    <g id="limonero">
      <rect x="-3" y="0" width="6" height="16" fill="#7a5230"/>
      <circle cx="0" cy="-8" r="17" fill="#3f7a2c"/>
      <circle cx="-9" cy="-2" r="11" fill="#4a8a33"/>
      <circle cx="9" cy="-4" r="12" fill="#4a8a33"/>
      <circle cx="-6" cy="-12" r="3" fill="#f4c430"/>
      <circle cx="7" cy="-6" r="3" fill="#f4c430"/>
      <circle cx="-1" cy="0" r="3" fill="#f4c430"/>
      <circle cx="10" cy="-15" r="2.6" fill="#f4c430"/>
    </g>
    <g id="naranjo">
      <rect x="-3" y="0" width="6" height="14" fill="#7a5230"/>
      <circle cx="0" cy="-7" r="15" fill="#356b26"/>
      <circle cx="-6" cy="-9" r="3" fill="#e07b28"/>
      <circle cx="6" cy="-3" r="3" fill="#e07b28"/>
      <circle cx="2" cy="-14" r="2.6" fill="#e07b28"/>
    </g>
    <g id="palmera">
      <path d="M0 0 C 3 -30, -2 -60, 4 -92" stroke="#8a5a2b" stroke-width="6" fill="none" stroke-linecap="round"/>
      <g fill="#3f7a2c" transform="translate(4 -92)">
        <path d="M0 0 C -20 -14, -40 -8, -52 8 C -36 -2, -20 -2, 0 0Z"/>
        <path d="M0 0 C 20 -14, 40 -8, 52 8 C 36 -2, 20 -2, 0 0Z"/>
        <path d="M0 0 C -12 -20, -30 -26, -44 -20 C -26 -16, -14 -10, 0 0Z"/>
        <path d="M0 0 C 12 -20, 30 -26, 44 -20 C 26 -16, 14 -10, 0 0Z"/>
        <path d="M0 0 C -4 -16, 2 -30, 6 -38 C 6 -24, 4 -12, 0 0Z"/>
      </g>
      <g fill="#e09a2b"><circle cx="0" cy="-86" r="3"/><circle cx="8" cy="-86" r="3"/><circle cx="4" cy="-82" r="3"/></g>
    </g>
  </defs>

  <!-- Sierra al fondo -->
  <path d="M0 110 L 60 92 L 120 100 L 190 70 L 250 88 L 320 64 L 380 84 L 450 76 L 520 96 L 600 72
           L 680 90 L 760 60 L 830 82 L 900 74 L 980 94 L 1050 70 L 1120 90 L 1200 110 V 200 H 0 Z"
        fill="#c9b48a" opacity="0.7"/>
  <!-- Lomas verdes -->
  <path d="M0 132 C 150 108, 260 126, 400 116 S 650 100, 800 118 S 1050 112, 1200 132 V 200 H 0 Z" fill="#a9c97a"/>
  <!-- Bancales -->
  <path d="M0 150 C 200 136, 380 146, 560 140 L 600 200 H 0 Z" fill="url(#surcos)"/>
  <path d="M560 140 C 760 134, 980 142, 1200 150 V 200 H 600 Z" fill="url(#surcos2)"/>
  <!-- Acequia -->
  <path d="M0 176 C 180 168, 320 184, 520 174 S 860 166, 1000 176 S 1140 182, 1200 176"
        stroke="#5aa6c9" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M40 175 h 30 M 300 178 h 26 M 640 171 h 30 M 940 174 h 24"
        stroke="#bfe3f2" stroke-width="2" stroke-linecap="round"/>
  <!-- Tierra en primer plano -->
  <path d="M0 186 C 300 180, 600 192, 900 184 S 1100 186, 1200 186 V 200 H 0 Z" fill="#c69a63"/>

  <!-- Barraca huertana: muros encalados y tejado de caña muy inclinado con su cruz -->
  <g transform="translate(470 146)">
    <rect x="-34" y="-20" width="68" height="26" fill="#fbf6ea" stroke="#d8c9a6"/>
    <path d="M-40 -18 L 0 -66 L 40 -18 Z" fill="#c9a25c"/>
    <path d="M-30 -24 L 0 -60 M 30 -24 L 0 -60 M -20 -22 L 0 -52 M 20 -22 L 0 -52" stroke="#a9813f" stroke-width="2"/>
    <path d="M0 -66 V -78 M -5 -73 H 5" stroke="#7a5230" stroke-width="2.4"/>
    <rect x="-8" y="-12" width="16" height="18" fill="#2a7aa3"/>
    <rect x="-26" y="-12" width="9" height="8" fill="#2a7aa3"/>
    <rect x="17" y="-12" width="9" height="8" fill="#2a7aa3"/>
  </g>

  <!-- Arbolado -->
  <use href="#palmera" x="150" y="150"/>
  <use href="#palmera" x="178" y="156" transform="scale(1)"/>
  <use href="#limonero" x="70" y="160"/>
  <use href="#limonero" x="260" y="158"/>
  <use href="#naranjo" x="330" y="162"/>
  <use href="#limonero" x="390" y="156"/>
  <use href="#naranjo" x="580" y="160"/>
  <use href="#limonero" x="650" y="156"/>
  <use href="#limonero" x="720" y="160"/>
  <use href="#palmera" x="830" y="152"/>
  <use href="#naranjo" x="900" y="162"/>
  <use href="#limonero" x="970" y="158"/>
  <use href="#limonero" x="1050" y="162"/>
  <use href="#naranjo" x="1130" y="158"/>
</svg>
