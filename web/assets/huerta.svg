<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" preserveAspectRatio="xMidYMax meet">
  <!-- Paisaje de la huerta de Murcia (se repite en horizontal): sierra, bancales, acequia,
       filas de limoneros. Los extremos encajan para que el mosaico sea continuo. -->
  <defs>
    <pattern id="surcos" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(-8)">
      <rect width="14" height="14" fill="#9cc365"/>
      <rect width="14" height="5" fill="#86b04f"/>
    </pattern>
    <pattern id="surcos2" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(6)">
      <rect width="12" height="12" fill="#b9cf6a"/>
      <rect width="12" height="4" fill="#a3bd55"/>
    </pattern>
    <g id="limonero">
      <rect x="-3" y="0" width="6" height="17" fill="#6e4a2a"/>
      <circle cx="0" cy="-9" r="18" fill="#2f6b2a"/>
      <circle cx="-10" cy="-3" r="12" fill="#3b7d31"/>
      <circle cx="10" cy="-5" r="13" fill="#3b7d31"/>
      <circle cx="0" cy="-17" r="10" fill="#4a8f3a"/>
      <g fill="#f6d23a" stroke="#d8a91f" stroke-width="0.8">
        <ellipse cx="-7" cy="-12" rx="3.6" ry="2.8" transform="rotate(-25 -7 -12)"/>
        <ellipse cx="8" cy="-8" rx="3.6" ry="2.8" transform="rotate(20 8 -8)"/>
        <ellipse cx="-1" cy="0" rx="3.6" ry="2.8"/>
        <ellipse cx="11" cy="-17" rx="3.2" ry="2.6" transform="rotate(-15 11 -17)"/>
        <ellipse cx="-14" cy="0" rx="3.2" ry="2.6" transform="rotate(30 -14 0)"/>
        <ellipse cx="2" cy="-22" rx="3.2" ry="2.6"/>
      </g>
    </g>
  </defs>

  <!-- Sierra al fondo -->
  <path d="M0 110 L 60 92 L 120 100 L 190 70 L 250 88 L 320 64 L 380 84 L 450 76 L 520 96 L 600 72
           L 680 90 L 760 60 L 830 82 L 900 74 L 980 94 L 1050 70 L 1120 90 L 1200 110 V 200 H 0 Z"
        fill="#c9b48a" opacity="0.7"/>
  <!-- Lomas verdes -->
  <path d="M0 132 C 150 108, 260 126, 400 116 S 650 100, 800 118 S 1050 112, 1200 132 V 200 H 0 Z" fill="#a9c97a"/>
  <!-- Bancales -->
  <path d="M0 150 C 200 136, 380 146, 560 140 L 600 200 H 0 Z" fill="url(#surcos)"/>
  <path d="M560 140 C 760 134, 980 142, 1200 150 V 200 H 600 Z" fill="url(#surcos2)"/>
  <!-- Acequia -->
  <path d="M0 176 C 180 168, 320 184, 520 174 S 860 166, 1000 176 S 1140 182, 1200 176"
        stroke="#5aa6c9" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M40 175 h 30 M 300 178 h 26 M 640 171 h 30 M 940 174 h 24"
        stroke="#bfe3f2" stroke-width="2" stroke-linecap="round"/>
  <!-- Tierra en primer plano -->
  <path d="M0 186 C 300 180, 600 192, 900 184 S 1100 186, 1200 186 V 200 H 0 Z" fill="#c69a63"/>

  <!-- Limoneros del fondo (más pequeños, en la loma) -->
  <g transform="translate(0 20) scale(1 1)" opacity="0.9">
  <g transform="scale(0.62) translate(0 0)">
    <use href="#limonero" x="40" y="221"/>
    <use href="#limonero" x="133" y="221"/>
    <use href="#limonero" x="227" y="221"/>
    <use href="#limonero" x="320" y="221"/>
    <use href="#limonero" x="414" y="221"/>
    <use href="#limonero" x="508" y="221"/>
    <use href="#limonero" x="601" y="221"/>
    <use href="#limonero" x="695" y="221"/>
    <use href="#limonero" x="788" y="221"/>
    <use href="#limonero" x="882" y="221"/>
    <use href="#limonero" x="975" y="221"/>
    <use href="#limonero" x="1069" y="221"/>
    <use href="#limonero" x="1162" y="221"/>
    <use href="#limonero" x="1256" y="221"/>
    <use href="#limonero" x="1350" y="221"/>
    <use href="#limonero" x="1443" y="221"/>
    <use href="#limonero" x="1537" y="221"/>
    <use href="#limonero" x="1630" y="221"/>
    <use href="#limonero" x="1724" y="221"/>
    <use href="#limonero" x="1817" y="221"/>
    <use href="#limonero" x="1911" y="221"/>
  </g>
  </g>

  <!-- Limoneros en hilera junto a la acequia -->
  <use href="#limonero" x="35" y="160"/>
  <use href="#limonero" x="105" y="163"/>
  <use href="#limonero" x="175" y="159"/>
  <use href="#limonero" x="245" y="162"/>
  <use href="#limonero" x="315" y="158"/>
  <use href="#limonero" x="385" y="162"/>
  <use href="#limonero" x="450" y="159"/>
  <use href="#limonero" x="515" y="163"/>
  <use href="#limonero" x="575" y="160"/>
  <use href="#limonero" x="645" y="163"/>
  <use href="#limonero" x="715" y="158"/>
  <use href="#limonero" x="785" y="162"/>
  <use href="#limonero" x="855" y="159"/>
  <use href="#limonero" x="925" y="163"/>
  <use href="#limonero" x="995" y="159"/>
  <use href="#limonero" x="1065" y="162"/>
  <use href="#limonero" x="1135" y="160"/>
</svg>
